<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/cambiar_contraseña.css' %}">
</head>

<body>
    <div class="main-container">
        <!-- Logo Inntesec -->
        <img src="{% static 'img/inntesec_logo_negro.avif' %}" alt="Inntesec" class="intesec-logo">

        <div class="password-container">
            <h1>🔒 Cambiar Contraseña</h1>

            <form method="POST">
                {% csrf_token %}

                {% if messages %}
                {% for message in messages %}
                {% if message.tags == 'success' %}
                <div class="success-message">{{ message }}</div>
                {% else %}
                <div class="error-message">{{ message }}</div>
                {% endif %}
                {% endfor %}
                {% endif %}

                <label for="actual">Contraseña actual</label>
                <input type="password" id="actual" name="actual" placeholder="Ingresa tu contraseña actual" required>

                <label for="nueva">Nueva contraseña</label>
                <input type="password" id="nueva" name="nueva" placeholder="Mínimo 8 caracteres" required>

                <label for="confirmar">Confirmar nueva contraseña</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Confirma la nueva contraseña"
                    required>

                <button type="submit">Guardar cambios</button>
            </form>

            <div class="back-to-login">
                <a href="{% url 'login' %}">← Volver al inicio de sesión</a>
            </div>
        </div>

        <!-- Botón para cambiar tema -->
        <button id="theme-switcher">🌓</button>
    </div>

    <script>
        // === Script para cambiar entre modo claro y oscuro ===
        const switcher = document.getElementById('theme-switcher');
        const root = document.documentElement;
        const currentTheme = localStorage.getItem('theme') || 'light';
        root.setAttribute('data-theme', currentTheme);
        switcher.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        switcher.addEventListener('click', () => {
            const newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            switcher.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>

</html>
