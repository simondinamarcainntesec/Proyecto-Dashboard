{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iniciar Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

  <div class="main-container">

    <img src="{% static 'img/inntesec CSS negro 1.avif' %}" alt="Logo Inntesec" class="intesec-logo">

    <div class="login-container">
      <button id="theme-switcher"></button>
      <h1>Iniciar Sesión</h1>

      {% if messages %}
        {% for message in messages %}
          <p class="error-message">{{ message }}</p>
        {% endfor %}
      {% endif %}

      {% if form.errors %}
        <p class="error-message">Credenciales inválidas o empresa no encontrada.</p>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <label for="username">Correo o Usuario</label>
        <input type="text" name="username" id="username" placeholder="ejemplo@empresa.com" required autofocus>

        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" placeholder="••••••••" required>

        <button type="submit">Entrar</button>
      </form>

      <p class="footer-note">Inntesec © {{ now|date:"Y" }}</p>
    </div>

  </div>

  <script src="{% static 'js/theme-switcher.js' %}"></script>
</body>
</html>
