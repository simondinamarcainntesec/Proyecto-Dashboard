{% load static %}

<div id="configModal" class="modal-overlay hidden" aria-hidden="true">
  <div class="modal-card">
    <!-- ① Toast de confirmación -->
    <div id="saveToast" class="save-toast hidden">
      ✅ Preferencias guardadas
    </div>

    <!-- ② Cabecera -->
    <div class="modal-head">
      <h3>Configuración de Notificaciones</h3>
      <button class="close-btn" type="button" aria-label="Cerrar" onclick="toggleConfigModal(false)">×</button>
    </div>

    <!-- ③ Formulario -->
    <form method="POST" id="configForm" action="{% url 'config_notificaciones' %}">
      {% csrf_token %}
      <div class="modal-body">
        <!-- Alerta por Teléfono -->
        <div class="config-option {% if user.Alarma_Telefono %}is-active{% endif %}">
          <span>📞 The alerta por Teléfono</span>
          <label class="switch">
            <input type="checkbox" id="toggleTelefono" name="Alarma_Telefono" {% if user.Alarma_Telefono %}checked{% endif %}>
          </label>
        </div>

        <!-- 🔹 Franja horaria -->
        <div id="franjaHoraria" class="franja-horaria {% if not user.Alarma_Telefono %}hidden{% endif %}">
          <label for="hora_inicio" class="franja-label">🕒 Recibir notificaciones desde:</label>
          <select
            id="hora_inicio"
            name="hora_inicio"
            class="franja-input"
            data-current-value="{{ user.hora_inicio|default:'' }}"
          >
            <!-- Opciones se rellenan por JS -->
          </select>

          <label for="hora_fin" class="franja-label">Hasta:</label>
          <select
            id="hora_fin"
            name="hora_fin"
            class="franja-input"
            data-current-value="{{ user.hora_fin|default:'' }}"
          >
            <!-- Opciones se rellenan por JS -->
          </select>
        </div>

        <!-- Alerta por Correo -->
        <div class="config-option {% if user.Alarma_Correo %}is-active{% endif %}">
          <span>📧 Alerta por Correo</span>
          <label class="switch">
            <input type="checkbox" name="Alarma_Correo" {% if user.Alarma_Correo %}checked{% endif %}>
          </label>
        </div>

        <!-- Alerta por Telegram -->
        <div class="config-option {% if user.Alarma_Telegram %}is-active{% endif %}">
          <span>💬 Alerta por Telegram</span>
          <label class="switch">
            <input type="checkbox" id="toggleTelegram" name="Alarma_Telegram" {% if user.Alarma_Telegram %}checked{% endif %}>
          </label>
        </div>

        <!-- 🖼️ Imagen QR (solo visible si Telegram está activado) -->
        <div id="qrTelegram" class="{% if not user.Alarma_Telegram %}hidden{% endif %}">
          <div class="qr-container">
            <img src="{% static 'img/qr-code (3).png' %}" alt="Código QR Telegram" class="qr-image">
            <p class="qr-text">Escanea este código para vincular tu cuenta de Telegram</p>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <button type="submit" class="btn primary">Guardar</button>
        <button type="button" class="btn ghost" onclick="toggleConfigModal(false)">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- CSS y JS -->
<link rel="stylesheet" href="{% static 'css/config_notificaciones.css' %}?v={% now 'U' %}">
<script defer src="{% static 'js/config_notificaciones_modal.js' %}?v={% now 'U' %}"></script>
