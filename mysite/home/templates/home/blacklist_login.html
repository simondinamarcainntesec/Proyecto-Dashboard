{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticación – Inntesec</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/home_portal.css' %}?v={% now 'U' %}">
</head>
<body>
  <main class="card" role="main">
    <div class="logo">
      <img src="{% static 'img/inntesec_logo_negro.png' %}" alt="Inntesec">
    </div>
    <h1>Autenticación requerida</h1>
    <p class="sub">Ingresa tus credenciales para continuar.</p>

    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'blacklist_download_root' %}">
      {% csrf_token %}
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Autenticar</button>
      </div>
    </form>

    <p class="hint">Se solicitarán credenciales en cada intento.</p>
  </main>
</body>
</html>
